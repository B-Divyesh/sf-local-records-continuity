[package]
name = "continuity-pack"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Build, encrypt, verify, and restore readable recovery packs for local business records"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-local-records-continuity"
homepage = "https://local-records-continuity.sociobot.in"
readme = "../../README.md"
keywords = ["backup", "recovery", "encryption", "cli"]
categories = ["command-line-utilities", "filesystem"]
include = ["src/**", "tests/**", "../../README.md", "../../LICENSE"]

[[bin]]
name = "continuity"
path = "src/main.rs"

[dependencies]
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.47", features = ["derive"] }
hex = "0.4.3"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
rand = "0.8.5"
rpassword = "7.4.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tar = "0.4.44"
thiserror = "2.0.16"
toml = "0.9.5"
walkdir = "2.5.0"
zstd = "0.13.3"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.21.0"
